#version: '3'
services:

  ace-db:
    image: mysql:8.0
    container_name: ace-db
    # the market's append-only ledger triggers are created by the shard update runner's non-SUPER user while binary logging is on
    command: --log-bin-trust-function-creators=1
    env_file:
      - docker.env
    volumes:
      - ./db-data:/var/lib/mysql
    ports:
      - "3306:3306/tcp"
    restart: unless-stopped
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]

  ace-server:
    build: .
    image: acemulator/ace:latest
    depends_on:
      ace-db:
        condition: service_healthy
    container_name: ace-server
    env_file:
      - docker.env
    volumes:
      - ./Config:/ace/Config
      - ./Content:/ace/Content
      - ./Dats:/ace/Dats
      - ./Logs:/ace/Logs
      - ./Mods:/ace/Mods
    ports:
      - "9000-9001:9000-9001/udp"
    stdin_open: true
    #restart: unless-stopped
    restart: on-failure
