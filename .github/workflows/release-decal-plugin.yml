name: Build and publish LegACEy Decal Plugin

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      release_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'apourman/LegACEy' && github.ref == 'refs/heads/master'
    runs-on: windows-2022
    steps:
      - name: Check out the release-please source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify release inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ($env:RELEASE_TAG -cne "decal-plugin-v$env:RELEASE_VERSION" -or $env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Invalid plugin release tag or version'
          }
          if ((git rev-parse HEAD) -ne $env:RELEASE_SHA -or (Get-Content decal-plugin/VERSION -Raw).Trim() -ne $env:RELEASE_VERSION) {
            throw 'Release inputs do not match the source version'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # The same script runs on the promote pull request, so a release only builds what already passed there.
      - name: Test, build, package and build the installer
        env:
          PLUGIN_VERSION: ${{ inputs.release_version }}
        run: ./decal-plugin/build/Build-Release.ps1 -Version $env:PLUGIN_VERSION -WorkDirectory "$env:RUNNER_TEMP/plugin-release"

      - name: Record package provenance
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $source = @{ tag = $env:RELEASE_TAG; sha = $env:RELEASE_SHA; version = $env:RELEASE_VERSION }
          $source | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/plugin-release/plugin-package/source.json" -Encoding utf8

      - name: Save the verified release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: decal-plugin-release-package
          path: |
            ${{ runner.temp }}/plugin-release/plugin-package/*.dll
            ${{ runner.temp }}/plugin-release/plugin-package/*.zip
            ${{ runner.temp }}/plugin-release/plugin-package/*.exe
            ${{ runner.temp }}/plugin-release/plugin-package/SHA256SUMS.txt
            ${{ runner.temp }}/plugin-release/plugin-package/source.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'apourman/LegACEy' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact package source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Retrieve the verified package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: decal-plugin-release-package
          path: ${{ runner.temp }}/plugin-package

      - name: Attach assets and publish the release-please draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 decal-plugin/build/publish_release.py --package "$RUNNER_TEMP/plugin-package"
