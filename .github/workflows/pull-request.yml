name: Pull request checks

# The cheap checks for every pull request: no retail DATs, no MySQL, no game data. The local gate (scripts/market/gate.sh) runs these
# too, plus the test suites that need MySQL and the end-to-end stack. Deploys stay in deploy-main.yml (pushes to master).
on:
  pull_request:
    branches:
      - master
      - marketplace
      - marketplace-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # Node 22: the website's images (docker/market-web/Dockerfile, Dockerfile.production) build and run on node:22
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: market-web/package-lock.json

      - name: Build the .NET solution
        run: dotnet build Source/ACE.sln -c Debug -p:Platform=x64

      - name: Install the website's dependencies
        working-directory: market-web
        run: npm ci

      - name: Type check the website
        working-directory: market-web
        run: npm run typecheck

      - name: Build the website for production
        working-directory: market-web
        run: npm run build

      # Vitest: the BFF's request tests (bff-tests/), the unit tests and the component tests (tests/*.test.ts, tests/*.test.tsx)
      - name: Run the BFF, unit and component tests
        working-directory: market-web
        run: npm run test:bff

      - name: Check the OpenAPI document and the generated client for drift
        run: scripts/market/openapi-drift.sh
