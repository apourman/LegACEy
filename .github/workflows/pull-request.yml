name: Pull request checks

# The checks for every pull request that need no retail DATs, MySQL or game data. The local gate (scripts/market/gate.sh) runs these
# too, plus the test suites that need MySQL and the end-to-end stack. Deploys stay in deploy-main.yml (pushes to master).
# They also run everything the releases run, in the release configuration: the server's Linux Release publish on every pull request,
# and the plugin's Windows Release build (windows-plugin) on the promote pull request into master and on runs started by hand, so nothing
# first builds or tests at release time. Release-please pull requests only bump versions and changelogs of code that already passed
# here, so both jobs skip on them (a skipped job still satisfies the required checks) and those merges stay instant.
on:
  pull_request:
    branches:
      - master
      - next
      - marketplace
      - marketplace-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # Node 22: the website's images (docker/market-web/Dockerfile, Dockerfile.production) build and run on node:22
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: market-web/package-lock.json

      - name: Build the .NET solution
        run: dotnet build Source/ACE.sln -c Debug -p:Platform=x64

      # What the server release (deploy-main.yml) runs before it packages
      - name: Check server release source verification
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'

      - name: Publish ACE for Linux x64 in Release
        run: >-
          dotnet publish Source/ACE.Server/ACE.Server.csproj
          --configuration Release --runtime linux-x64 --self-contained false
          -p:Platform=x64 --output "$RUNNER_TEMP/ace-publish"

      - name: Install the website's dependencies
        working-directory: market-web
        run: npm ci

      - name: Type check the website
        working-directory: market-web
        run: npm run typecheck

      - name: Build the website for production
        working-directory: market-web
        run: npm run build

      # Vitest: the BFF's request tests (bff-tests/), the unit tests and the component tests (tests/*.test.ts, tests/*.test.tsx)
      - name: Run the BFF, unit and component tests
        working-directory: market-web
        run: npm run test:bff

      - name: Check the OpenAPI document and the generated client for drift
        run: scripts/market/openapi-drift.sh

  # The plugin release's build (release-decal-plugin.yml), the same script on the same runner image
  windows-plugin:
    if: (github.base_ref == 'master' && !startsWith(github.head_ref, 'release-please--')) || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Test, build, package and build the installer
        run: ./decal-plugin/build/Build-Release.ps1 -WorkDirectory "$env:RUNNER_TEMP/plugin-release"
