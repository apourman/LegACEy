name: Build, deploy, and release ACE

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to retry (for example v0.1.0)
        required: false
        type: string
      source_run_id:
        description: Successful build run whose release archive should be reused
        required: false
        type: string

concurrency:
  group: ace-production
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out merged master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Publish ACE for Linux x64
        run: >-
          dotnet publish Source/ACE.Server/ACE.Server.csproj
          --configuration Release --runtime linux-x64 --self-contained false
          -p:Platform=x64 --output "$RUNNER_TEMP/ace-publish"

      - name: Package ACE for GitHub Releases
        run: |
          mkdir -p "$RUNNER_TEMP/ace-release"
          tar -czf "$RUNNER_TEMP/ace-release/LegACEy-server-linux-x64.tar.gz" \
            --exclude='Config.js' \
            --exclude='log4net.config' \
            --exclude='ACE_Log.txt*' \
            --exclude='DatabaseSetupScripts/Updates/*/applied_updates.txt' \
            -C "$RUNNER_TEMP/ace-publish" .

      - name: Save the GitHub Release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ace-release-package
          path: ${{ runner.temp }}/ace-release/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' && needs.build.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.release_tag != '' && inputs.source_run_id != '')
      )
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      sha: ${{ steps.verify-source.outputs.sha }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Retrieve the package from this workflow run
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ace-release-package
          path: ${{ runner.temp }}/ace-release

      - name: Retrieve the package from the specified build run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ace-release-package
          path: ${{ runner.temp }}/ace-release
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the release tag matches the package source
        id: verify-source
        run: |
          if [[ -n "$RELEASE_SHA" ]]; then
            [[ "$RELEASE_SHA" == "$GITHUB_SHA" ]] || {
              echo 'Release tag does not match the source used for this build' >&2
              exit 1
            }
            source_sha="$RELEASE_SHA"
          else
            source_sha=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')
            build_conclusion=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" \
              --jq '[.jobs[] | select(.name == "build") | .conclusion][0] // empty')
            [[ "$build_conclusion" == success ]] || {
              echo 'The selected source run does not have a successful build' >&2
              exit 1
            }
            tag_sha=$(gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
            [[ "$source_sha" == "$tag_sha" ]] || {
              echo 'Release tag does not match the source used for the selected build' >&2
              exit 1
            }
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Attach the package and publish the release
        run: |
          asset="LegACEy-${RELEASE_TAG}-linux-x64.tar.gz"
          cp "$RUNNER_TEMP/ace-release/LegACEy-server-linux-x64.tar.gz" "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && sha256sum "$asset" > "$asset.sha256")
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/$asset.sha256" \
            --clobber --repo "$REPOSITORY"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$REPOSITORY"

  deploy:
    if: always() && needs.publish-release.result == 'success' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master')
    needs: [release-please, build, publish-release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
    env:
      DEPLOY_HOST: ${{ vars.ACE_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.ACE_DEPLOY_USER }}
      RELEASE_SHA: ${{ needs.publish-release.outputs.sha }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_ROOT: ${{ vars.ACE_RELEASE_ROOT }}
    steps:
      - name: Mask deployment details
        run: |
          for value in "$DEPLOY_HOST" "$DEPLOY_USER" "$RELEASE_ROOT"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Validate deployment variables
        run: |
          [[ -n "$DEPLOY_HOST" ]] || { echo 'ACE_DEPLOY_HOST is not configured in the production environment' >&2; exit 1; }
          [[ -n "$DEPLOY_USER" ]] || { echo 'ACE_DEPLOY_USER is not configured in the production environment' >&2; exit 1; }
          [[ -n "$RELEASE_ROOT" ]] || { echo 'ACE_RELEASE_ROOT is not configured in the production environment' >&2; exit 1; }

      - name: Retrieve the package from this workflow run
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ace-release-package
          path: ${{ runner.temp }}/ace-release

      - name: Retrieve the package from the specified build run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ace-release-package
          path: ${{ runner.temp }}/ace-release
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the published application
        run: |
          mkdir -p "$RUNNER_TEMP/ace-publish"
          tar -xzf "$RUNNER_TEMP/ace-release/LegACEy-server-linux-x64.tar.gz" \
            -C "$RUNNER_TEMP/ace-publish"

      - name: Load the passphrase-protected deployment key
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.ACE_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_PASSPHRASE: ${{ secrets.ACE_DEPLOY_SSH_PASSPHRASE }}
        run: |
          eval "$(ssh-agent -s)"
          printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          askpass=$(mktemp "$RUNNER_TEMP/ace-askpass.XXXXXX")
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$DEPLOY_PASSPHRASE"' > "$askpass"
          chmod 700 "$askpass"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" | \
            SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force setsid ssh-add -

      - name: Configure SSH host verification
        env:
          KNOWN_HOSTS: ${{ secrets.ACE_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create the release directory
        run: |
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "if [ \"\$(readlink -f /opt/legacey/ace 2>/dev/null)\" = '$RELEASE_ROOT/$RELEASE_SHA' ]; then
               echo 'Refusing to overwrite the active release' >&2
               exit 1
             fi
             mkdir -p '$RELEASE_ROOT/$RELEASE_SHA' && chmod 755 '$RELEASE_ROOT/$RELEASE_SHA'"

      - name: Upload only the published application
        run: |
          rsync --archive --compress --delete \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            --exclude='Config.js' \
            --exclude='log4net.config' \
            --exclude='DatabaseSetupScripts/Updates/*/applied_updates.txt' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            "$RUNNER_TEMP/ace-publish/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE_ROOT/$RELEASE_SHA/"

      - name: Atomically switch, back up, restart, and validate ACE
        run: |
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/legacey-cd-deploy '$RELEASE_SHA'"

      - name: Stop the deployment agent and remove SSH host data
        if: always()
        run: |
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k
          fi
          rm -f "$HOME/.ssh/known_hosts"
