services:
  ace-db:
    image: mysql:8.0
    # the market's append-only ledger triggers are created by the shard update runner's non-SUPER user while binary logging is on
    command: --log-bin-trust-function-creators=1
    env_file: ../docker.env
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3310}:3306"
    environment:
      DB_ROOT: /repo/Database
      ACE_DB_AUTH_NAME: ace_auth
      ACE_DB_SHARD_NAME: ace_shard
      ACE_DB_WORLD_NAME: ace_world
    volumes:
      - db-data:/var/lib/mysql
      - ../Database:/repo/Database:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The Market API (local only): its own image, reaching ace-db over the compose network. The game server runs natively on the host.
  # It is private: no host port. Only the BFF (market-web) reaches it, on the market network they share; scripts/market/api.sh waits on the
  # container's own health check. After an API code change: scripts/market/api.sh
  market-api:
    build:
      context: ../Source
      dockerfile: ../docker/market-api/Dockerfile
    depends_on:
      ace-db:
        condition: service_healthy
    # only the application login and the service key from docker.env, never the root password: scripts/market/*.sh pass --env-file ../docker.env.
    # An empty service key stops the API at startup with a message saying so (scripts/market/api.sh checks it first).
    environment:
      ASPNETCORE_ENVIRONMENT: Local
      Market__DatabaseUsername: ${MYSQL_USER:-}
      Market__DatabasePassword: ${MYSQL_PASSWORD:-}
      Market__ServiceKey: ${MARKET_SERVICE_KEY:-}
    networks:
      - default
      - market
    volumes:
      - ./market-api/appsettings.Local.json:/app/appsettings.Local.json:ro
      # ACE's configuration with no login in it: ace-db:3306 and /ace/Dats
      - ../Source/ACE.Server/Config.js.docker:/ace/Config/Config.js:ro
      - ${ACE_HOST_DAT_DIRECTORY:-${HOME}/ace_dats/retail}:/ace/Dats:ro
      # cached icons survive a rebuild (sessions live in the database)
      - market-api-icons:/data/icon-cache
    # health: the image's HEALTHCHECK (GET /health, which needs no key)

  # The BFF: the website's own server (market-web/server.js) with live reload, the one local origin, on the host's loopback only.
  # It is on the market network alone: it reaches market-api, never ace-db.
  market-web:
    build:
      context: ..
      dockerfile: docker/market-web/Dockerfile
    depends_on:
      market-api:
        condition: service_healthy
    # each from docker.env: the API's service key, and the secret that signs the session cookie (scripts/market/web.sh checks both first)
    environment:
      MARKET_API_URL: http://market-api:8080
      MARKET_SERVICE_KEY: ${MARKET_SERVICE_KEY:-}
      MARKET_COOKIE_SECRET: ${MARKET_COOKIE_SECRET:-}
      # no reverse proxy locally, so no trusted proxy: the client IP is the connection's address. The port is published on the host's
      # 127.0.0.1 only, and Docker delivers those connections from the network's gateway, which therefore counts as 127.0.0.1.
      MARKET_TRUSTED_PROXY: ""
      MARKET_GATEWAY_IS_LOOPBACK: "true"
    networks:
      - market
    ports:
      - "127.0.0.1:${MARKET_WEB_PORT:-5173}:5173"
    volumes:
      - ${MARKET_WEB_SOURCE:-../market-web}:/app
      - market-web-dependencies:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      # npm ci runs first on every start
      start_period: 180s

networks:
  # the BFF and the API, and nothing else
  market:

volumes:
  market-web-dependencies:
  db-data:
  market-api-icons:
