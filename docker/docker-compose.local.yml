services:
  ace-db:
    image: mysql:8.0
    # the market's append-only ledger triggers are created by the shard update runner's non-SUPER user while binary logging is on
    command: --log-bin-trust-function-creators=1
    env_file: ../docker.env
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3310}:3306"
    environment:
      DB_ROOT: /repo/Database
      ACE_DB_AUTH_NAME: ace_auth
      ACE_DB_SHARD_NAME: ace_shard
      ACE_DB_WORLD_NAME: ace_world
    volumes:
      - db-data:/var/lib/mysql
      - ../Database:/repo/Database:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The Market API (local only): its own image, reaching ace-db over the compose network. The game server runs natively on the host.
  # After an API code change: docker compose -f docker/docker-compose.local.yml up -d --build market-api
  market-api:
    build:
      context: ../Source
      dockerfile: ../docker/market-api/Dockerfile
    depends_on:
      ace-db:
        condition: service_healthy
    # MYSQL_USER and MYSQL_PASSWORD become the API's database login (see the Dockerfile's entrypoint)
    env_file: ../docker.env
    environment:
      ASPNETCORE_ENVIRONMENT: Local
    ports:
      # loopback only: plain HTTP is never reachable from another machine
      - "127.0.0.1:${MARKET_API_PORT:-5080}:8080"
    volumes:
      - ./market-api/appsettings.Local.json:/app/appsettings.Local.json:ro
      # ACE's configuration with no login in it: ace-db:3306 and /ace/Dats
      - ../Source/ACE.Server/Config.js.docker:/ace/Config/Config.js:ro
      - ${ACE_HOST_DAT_DIRECTORY:-${HOME}/ace_dats/retail}:/ace/Dats:ro
      # sessions and icons survive a rebuild
      - market-api-keys:/data/keys
      - market-api-icons:/data/icon-cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/facets"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  market-api-keys:
  market-api-icons:
